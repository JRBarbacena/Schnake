<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Who's the Snake King - A multiplayer snake arena game">
  <meta name="theme-color" content="#0a0a1a">
  <title>Who's the Snake King</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #ffffff;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ─── UI Root (Lobby, Customization overlays) ────────────────────────── */
    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #ui-root > * {
      pointer-events: auto;
    }

    /* ─── Lobby Styles ───────────────────────────────────────────────────── */
    .lobby-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 10, 26, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .lobby-title {
      font-size: clamp(24px, 5vw, 48px);
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      text-align: center;
    }
    .lobby-name-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lobby-name-section label {
      font-size: 14px;
      color: #aaa;
    }
    .lobby-name-input {
      width: 260px;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .lobby-name-input:focus {
      border-color: #22c55e;
    }
    .lobby-mode-section {
      text-align: center;
    }
    .lobby-mode-section h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }
    .lobby-mode-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
    }
    .lobby-mode-btn {
      padding: 10px 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lobby-mode-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }
    .lobby-mode-btn.selected {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }
    .lobby-play-btn {
      padding: 14px 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
    }
    .lobby-play-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(34, 197, 94, 0.5);
    }
    .lobby-play-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .lobby-stats-section {
      font-size: 12px;
      color: #888;
    }
    .lobby-stat-value {
      color: #ccc;
      font-weight: bold;
    }
    .lobby-challenge-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 10px;
      padding: 14px 20px;
      max-width: 320px;
      text-align: center;
    }
    .lobby-challenge-card h3 {
      color: #ffd700;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .challenge-objective {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 4px;
    }
    .challenge-reward {
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 4px;
    }
    .challenge-countdown {
      font-size: 11px;
      color: #888;
    }

    /* ─── Customization Styles ───────────────────────────────────────────── */
    .customization-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 26, 0.95);
      z-index: 25;
    }
    .customization-title {
      color: #ffd700;
      margin-bottom: 16px;
    }
    .customization-layout {
      display: flex;
      gap: 24px;
      max-width: 600px;
    }
    .customization-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .customization-section h4 {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .customization-canvas {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }
    .skin-grid, .pattern-group, .headshape-group, .trail-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .skin-btn, .pattern-btn, .headshape-btn, .trail-btn {
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: transparent;
      color: #ccc;
      font-size: 11px;
      cursor: pointer;
    }
    .skin-btn.selected, .pattern-btn.selected, .headshape-btn.selected, .trail-btn.selected {
      border-color: #22c55e;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
